name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  neovim-plugins:
    name: Neovim plugins
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Install Nix
        uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            accept-flake-config = true
            experimental-features = pipe-operators
      - name: Setup Nix cache
        uses: sub60/setup-cache@main
      - name: Test the Neovim plugins
        run: nix run .#tests.neovim-plugins
